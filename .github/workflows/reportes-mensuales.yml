name: Reportes mensuales

on:
  # 23:59 hora de Colombia (UTC-5) del dia 28 = 04:59 UTC del dia 29.
  # GitHub puede retrasar la ejecucion unos minutos.
  schedule:
    - cron: '59 4 29 * *'
  # Ejecucion manual; los campos son opcionales (vacios = periodo automatico).
  workflow_dispatch:
    inputs:
      inicio:
        description: 'Inicio del periodo (YYYY-MM-DD), opcional'
        required: false
        default: ''
      fin:
        description: 'Fin del periodo (YYYY-MM-DD), opcional'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  reportes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar sesion de Telegram
        env:
          SESION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
        run: printf '%s' "$SESION_B64" | base64 -d > session_name.session

      - name: Generar reportes y subir a Supabase
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE: ${{ secrets.TELEGRAM_PHONE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INICIO: ${{ inputs.inicio }}
          FIN: ${{ inputs.fin }}
        run: |
          if [ -n "$INICIO" ] && [ -n "$FIN" ]; then
            python reportes_mensuales.py "$INICIO" "$FIN"
          else
            python reportes_mensuales.py
          fi
