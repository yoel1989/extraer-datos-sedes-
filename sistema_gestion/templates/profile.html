{% extends "base.html" %}

{% block title %}Mi Perfil - {% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card text-center">
            <div class="card-body">
                <div class="mb-3">
                    <i class="fas fa-user-circle fa-5x text-primary"></i>
                </div>
                <h4>{{ current_user.nombre }} {{ current_user.apellido }}</h4>
                <p class="text-muted">{{ current_user.username }}</p>
                <span class="badge bg-{{ 'success' if current_user.is_admin() else 'info' }}">
                    {{ 'Administrador' if current_user.is_admin() else 'Usuario' }}
                </span>
            </div>
        </div>
    </div>
    
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5><i class="fas fa-user-edit me-2"></i>Información del Perfil</h5>
            </div>
            <div class="card-body">
                <form>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" value="{{ current_user.nombre }}" readonly>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="apellido" class="form-label">Apellido</label>
                            <input type="text" class="form-control" id="apellido" value="{{ current_user.apellido }}" readonly>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="username" value="{{ current_user.username }}" readonly>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" value="{{ current_user.email }}" readonly>
                    </div>
                    
                    <div class="mb-3">
                        <label for="rol" class="form-label">Rol</label>
                        <input type="text" class="form-control" id="rol" value="{{ current_user.rol }}" readonly>
                    </div>
                    
                    <div class="mb-3">
                        <label for="ultimo_login" class="form-label">Último Login</label>
                        <input type="text" class="form-control" id="ultimo_login" 
                               value="{{ current_user.ultimo_login.strftime('%d/%m/%Y %H:%M:%S') if current_user.ultimo_login else 'Nunca' }}" readonly>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <button type="button" class="btn btn-warning" onclick="alert('Función en desarrollo')">
                            <i class="fas fa-edit me-2"></i>Editar Perfil
                        </button>
                        <button type="button" class="btn btn-danger" onclick="alert('Función en desarrollo')">
                            <i class="fas fa-key me-2"></i>Cambiar Contraseña
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
